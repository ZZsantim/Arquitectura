  <rect x="510" y="700" width="280" height="75" class="box" fill="#ffedd5"/>
  <text x="650" y="733" class="label">Base de datos</text><text x="650" y="756" class="small">SQLite async / PostgreSQL</text>
  <path d="M255 630 V700 M670 630 V680 H270 V700 M670 680 H650 V700" class="line"/>

