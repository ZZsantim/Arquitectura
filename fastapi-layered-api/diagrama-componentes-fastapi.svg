<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: bold 26px sans-serif; fill: #0f172a; }
      .label { font: 16px sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 13px sans-serif; fill: #334155; text-anchor: middle; }
      .box { stroke: #334155; stroke-width: 2; rx: 12; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="600" y="42" class="title" text-anchor="middle">Arquitectura por componentes — FastAPI Layered API</text>

  <rect x="35" y="85" width="170" height="70" class="box" fill="#dbeafe"/>
  <text x="120" y="116" class="label">Cliente HTTP</text><text x="120" y="140" class="small">Swagger / ReDoc</text>
  <rect x="260" y="85" width="170" height="70" class="box" fill="#dbeafe"/>
  <text x="345" y="116" class="label">Uvicorn</text><text x="345" y="140" class="small">Servidor ASGI</text>
  <rect x="485" y="85" width="220" height="70" class="box" fill="#bfdbfe"/>
  <text x="595" y="116" class="label">app.main</text><text x="595" y="140" class="small">FastAPI + middleware + lifespan</text>
  <rect x="760" y="85" width="210" height="70" class="box" fill="#bfdbfe"/>
  <text x="865" y="116" class="label">api.v1.api</text><text x="865" y="140" class="small">Agregador de routers</text>

  <path d="M205 120 H260 M430 120 H485 M705 120 H760" class="line"/>

