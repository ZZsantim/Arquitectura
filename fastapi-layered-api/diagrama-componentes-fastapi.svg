  <rect x="520" y="390" width="280" height="80" class="box" fill="#ede9fe"/>
  <text x="660" y="425" class="label">NotificationService</text><text x="660" y="449" class="small">Casos de uso de notificación</text>
  <path d="M165 310 V350 H275 V390 M435 310 V350 H275 V390 M725 310 V350 H660 V390 M1020 310 V350 H275 V390 M1020 350 H660 V390" class="line"/>

  <rect x="120" y="550" width="270" height="80" class="box" fill="#fce7f3"/>
