  <rect x="330" y="230" width="210" height="80" class="box" fill="#dcfce7"/>
  <text x="435" y="265" class="label">users.py</text><text x="435" y="289" class="small">Usuarios protegidos</text>
  <rect x="600" y="230" width="250" height="80" class="box" fill="#dcfce7"/>
  <text x="725" y="265" class="label">notifications.py</text><text x="725" y="289" class="small">Públicas y privadas</text>
  <rect x="910" y="230" width="220" height="80" class="box" fill="#fef3c7"/>
  <text x="1020" y="265" class="label">api.deps</text><text x="1020" y="289" class="small">Depends + autenticación</text>

  <path d="M865 155 V190 H165 V230 M865 190 H435 V230 M865 190 H725 V230 M865 155 V230 H1020" class="line"/>

  <rect x="150" y="390" width="250" height="80" class="box" fill="#ede9fe"/>
