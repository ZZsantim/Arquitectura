  <rect x="520" y="550" width="300" height="80" class="box" fill="#fce7f3"/>
  <text x="670" y="585" class="label">NotificationRepository</text><text x="670" y="609" class="small">Consultas y filtros de propiedad</text>
  <path d="M275 470 V550 M660 470 V550" class="line"/>

  <rect x="155" y="700" width="230" height="75" class="box" fill="#ffedd5"/>
